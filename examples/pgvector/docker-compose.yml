# One small Postgres with pgvector for the example. Port 54329 so it does not fight a local Postgres.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: canary
      POSTGRES_PASSWORD: canary
      POSTGRES_DB: canary
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canary -d canary"]
      interval: 2s
      timeout: 3s
      retries: 30
